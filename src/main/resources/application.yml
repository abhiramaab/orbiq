server:
  port: 8080

spring:
  application:
    name: orbiq

  # Embedded H2 Database by default (0-setup local boot)
  datasource:
    url: jdbc:h2:mem:orbiqdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Redis Configuration (Local or Upstash)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: orbiq-dispatch-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

orbiq:
  h3:
    default-resolution: 8 # ~460 meter edge length, ideal for urban ride hailing
  dispatch:
    max-search-radius-rings: 3 # Expands to k-ring radius 1, 2, 3 (~1.5km - 3km)
    lock-timeout-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
